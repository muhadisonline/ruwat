<script>(function(){var key="ruwat-size";function get(){var n=Number(localStorage.getItem(key)||"0");return n>=0&&n<=3?n:0}function apply(n){document.documentElement.setAttribute("data-size",String(n));localStorage.setItem(key,String(n))}var gear=document.getElementById("gear"),panel=document.getElementById("set-panel");if(!gear)return;gear.addEventListener("click",function(e){e.stopPropagation();panel.hidden=!panel.hidden;gear.setAttribute("aria-expanded",String(!panel.hidden))});document.addEventListener("click",function(){panel.hidden=true;gear.setAttribute("aria-expanded","false")});panel.addEventListener("click",function(e){e.stopPropagation()});document.getElementById("size-down").addEventListener("click",function(){apply(Math.max(0,get()-1))});document.getElementById("size-up").addEventListener("click",function(){apply(Math.min(3,get()+1))})})();</script>
